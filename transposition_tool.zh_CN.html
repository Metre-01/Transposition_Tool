<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>移调工具（60 帧/秒）</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    max-width: 600px;
    margin: 0 auto;
    padding: 24px 16px 48px;
    background: #f5f6f8;
    color: #1f2328;
    line-height: 1.6;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { margin: 0 0 20px; color: #656d76; font-size: 13px; }
  .card {
    background: #fff;
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 14px;
    box-shadow: 0 1px 3px rgba(0,0,0,.07);
  }
  .card h2 { font-size: 15px; margin: 0 0 12px; font-weight: 600; }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .row label { width: 44px; color: #656d76; font-size: 14px; flex: none; }
  input[type=number] {
    flex: 1; min-width: 0;
    padding: 8px 10px;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    font-size: 15px;
    font-family: inherit;
  }
  input[type=number]:focus { outline: none; border-color: #2563eb; }
  button {
    margin-top: 6px;
    padding: 8px 20px;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  .out {
    margin-top: 10px;
    padding: 10px 12px;
    background: #f0f6ff;
    border-radius: 6px;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 15px;
    min-height: 24px;
    word-break: break-all;
  }
  footer { margin-top: 24px; text-align: center; color: #8c959f; font-size: 12px; }
  footer a { color: #8c959f; }
</style>
</head>
<body>
  <h1>移调工具（60 帧/秒）</h1>
  <p class="sub">视频剪辑辅助计算 · 仅支持 60 帧/秒模式</p>

  <form class="card" onsubmit="calcTF(); return false;">
    <h2>时长 → 帧数</h2>
    <div class="row"><label>时</label><input id="tf-h" type="number" placeholder="0"></div>
    <div class="row"><label>分</label><input id="tf-m" type="number" placeholder="0"></div>
    <div class="row"><label>秒</label><input id="tf-s" type="number" placeholder="0"></div>
    <div class="row"><label>帧</label><input id="tf-f" type="number" placeholder="0"></div>
    <button type="submit">计算</button>
    <div class="out" id="tf-out">—</div>
  </form>

  <form class="card" onsubmit="calcFT(); return false;">
    <h2>帧数 → 时长</h2>
    <div class="row"><label>帧数</label><input id="ft-in" type="number" placeholder="输入总帧数"></div>
    <button type="submit">计算</button>
    <div class="out" id="ft-out">—</div>
  </form>

  <form class="card" onsubmit="calcTP(); return false;">
    <h2>移调</h2>
    <div class="row"><label>帧数</label><input id="tp-f" type="number" placeholder="留空沿用上次结果"></div>
    <div class="row"><label>半音</label><input id="tp-s" type="number" step="any" placeholder="正数为升，负数为降"></div>
    <button type="submit">计算</button>
    <div class="out" id="tp-out">—</div>
  </form>

  <footer>
    <a href="https://github.com/Metre-01/Transposition_Tool/releases">下载桌面版</a>
  </footer>

<script>
(function () {
  const FPS = 60;
  const FRAMES_PER_HOUR = 3600 * FPS;  // 216000
  const FRAMES_PER_MIN  = 60 * FPS;    // 3600
  let lastFrames = 0;

  const $ = id => document.getElementById(id);

  function framesToTime(total) {
    let f = Math.max(0, Math.round(total));
    const h = Math.floor(f / FRAMES_PER_HOUR); f %= FRAMES_PER_HOUR;
    const m = Math.floor(f / FRAMES_PER_MIN);  f %= FRAMES_PER_MIN;
    const s = Math.floor(f / FPS);             f %= FPS;
    return { h, m, s, f };
  }

  function fmtTime(t) {
    const p = n => String(n).padStart(2, '0');
    return t.h + ':' + p(t.m) + ':' + p(t.s) + ':' + p(t.f);
  }

  function timeToFrames(h, m, s, f) {
    return h * FRAMES_PER_HOUR + m * FRAMES_PER_MIN + s * FPS + f;
  }

  function num(id, fallback) {
    const raw = $(id).value.trim();
    if (raw === '') return fallback;
    const v = Number(raw);
    return Number.isFinite(v) ? v : NaN;
  }

  window.calcTF = function () {
    const h = num('tf-h', 0), m = num('tf-m', 0),
          s = num('tf-s', 0), f = num('tf-f', 0);
    if ([h, m, s, f].some(Number.isNaN)) {
      $('tf-out').textContent = '无效输入';
      return;
    }
    const total = Math.round(timeToFrames(h, m, s, f));
    lastFrames = total;
    $('tf-out').textContent = `${h}:${m}:${s}:${f} = ${total} 帧`;
  };

  window.calcFT = function () {
    const total = num('ft-in', NaN);
    if (Number.isNaN(total)) {
      $('ft-out').textContent = '请输入帧数';
      return;
    }
    lastFrames = Math.round(total);
    $('ft-out').textContent =
      `${lastFrames} 帧 = ${fmtTime(framesToTime(lastFrames))}`;
  };

  window.calcTP = function () {
    const frames = num('tp-f', lastFrames);
    if (Number.isNaN(frames)) {
      $('tp-out').textContent = '无效输入';
      return;
    }
    if (frames === 0) {
      $('tp-out').textContent = '请先输入帧数';
      return;
    }
    const semis = num('tp-s', 0);
    if (Number.isNaN(semis)) {
      $('tp-out').textContent = '无效输入';
      return;
    }
    const result = Math.max(0, Math.round(frames * Math.pow(2, -semis / 12)));
    lastFrames = result;
    $('tp-out').textContent =
      `${frames} 帧 ${semis >= 0 ? '+' : ''}${semis} 半音 = ` +
      `${result} 帧 = ${fmtTime(framesToTime(result))}`;
  };
})();
</script>
</body>
</html>
